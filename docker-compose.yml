services:
  db:
    image: pgvector/pgvector:pg17
    container_name: docsassist-db
    environment:
      POSTGRES_USER: docsassist
      POSTGRES_PASSWORD: docsassist
      POSTGRES_DB: docsassist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  pgdata: